name: kernel

# Proves the claim this repository exists to make: that the A50 boot image can
# be rebuilt from nothing but this repository, on a machine that has never seen
# the device. If this job is green, the build is reproducible. If it is not,
# the build is not reproducible, whatever any README says.

on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'build/**'
      - '.github/workflows/kernel.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - 'build/**'
      - '.github/workflows/kernel.yml'
  workflow_dispatch:
    inputs:
      args:
        description: Extra build-kernel.sh options (non-default builds skip the hash gate)
        type: string
        default: ''
      google_clang:
        description: Bisect only - 'BRANCH clang-REV' of Google's prebuilt clang, mounted at /gclang
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # Kernel source, toolchain and object tree together need well over what a
      # runner has spare by default.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Build the build environment
        run: docker build -t a50-halium-build ./build

      - name: Fetch Google prebuilt clang (bisect only)
        if: inputs.google_clang != '' && inputs.google_clang != null
        env:
          GC: ${{ inputs.google_clang }}
        run: |
          set -- $GC
          mkdir -p "$RUNNER_TEMP/gclang"
          curl -fsSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$1/$2.tar.gz" | tar -xz -C "$RUNNER_TEMP/gclang"
          "$RUNNER_TEMP/gclang/bin/ld.lld" --version

      - name: Build the kernel
        run: |
          mkdir -p "$RUNNER_TEMP/gclang"
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$RUNNER_TEMP/gclang:/gclang:ro" \
            a50-halium-build \
            ./build/build-kernel.sh ${{ inputs.args }}

      - name: Report what was produced
        run: cat out/build-manifest.txt out/sha256sums.txt

      # Toolchain bisect: the exact compile commands of a few early-boot objects.
      - name: Keep early-boot compile commands
        run: |
          cd kernel/src
          sudo find . -name '.main.o.cmd' -path '*/init/*' -o -name '.setup.o.cmd' -path '*/arm64/kernel/*' -o -name '.head.o.cmd' -path '*/arm64/kernel/*' -o -name '.mmu.o.cmd' -path '*/arm64/mm/*' -o -name '.printk.o.cmd' -path '*/printk/*' | sudo tar -czf "$GITHUB_WORKSPACE/out/kernel-cmds.tar.gz" -T -
          sudo chmod a+r "$GITHUB_WORKSPACE/out/kernel-cmds.tar.gz"

      # The reproducibility gate. kernel/expected-artifacts.sha256 records the
      # hashes a correct build of the current pin produces. If a change to the
      # pin, the patches or the build environment alters the output, this fails
      # and the expected file has to be updated deliberately - with a rebuild
      # and a boot test behind it, not silently.
      - name: Verify artifacts match the recorded hashes
        if: inputs.args == '' || inputs.args == null
        run: |
          if [ ! -f kernel/expected-artifacts.sha256 ]; then
            echo "::warning::No kernel/expected-artifacts.sha256 recorded yet - the build is not gated."
            exit 0
          fi
          cd out && sha256sum -c ../kernel/expected-artifacts.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: a50-kernel-image
          path: |
            out/Image
            out/sha256sums.txt
            out/build-manifest.txt
            out/kernel.config
            out/System.map
            out/kernel-cmds.tar.gz
          retention-days: 30

      # A tag publishes the same artifacts as a release, so a flashable image
      # has a permanent home and a checksum anyone can verify.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Image
            out/sha256sums.txt
            out/build-manifest.txt
